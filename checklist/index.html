const millis = (t) => (t && t.toMillis ? t.toMillis() : typeof t === 'number' ? t : null);
function ago(t) {
  const m = millis(t);
  if (!m) return 'just now';
  const s = Math.max(0, (Date.now() - m) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' hr ago';
  if (s < 172800) return 'yesterday';
  return new Date(m).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function confetti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#E8641C', '#F59E0B', '#1F9D63', '#2F7AE5', '#E11D74'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[i % colors.length];
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    const d = 60 + Math.random() * 110;
    el.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 40}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: 0.6 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 80}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}

async function signIn() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e && e.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment' || code === 'auth/web-storage-unsupported') {
      await signInWithRedirect(auth, provider);
    } else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') {
      toast('Sign-in did not work. Please try again.');
    }
  }
}

function checkAdmin() {
  state.admin = !!(state.user && state.list && state.list.ownerUid === state.user.uid);
  if (state.admin && store.get('openAdmin')) { state.adminOpen = true; store.set('openAdmin', ''); }
}

onAuthStateChanged(auth, (u) => {
  state.user = u;
  checkAdmin();
  render();
});

if (cid) {
  onSnapshot(doc(db, 'checklists', cid), (snap) => {
    state.loaded = true;
    state.list = snap.exists() ? { id: snap.id, ...snap.data() } : null;
    if (state.list) { store.set('lastChecklist', cid); document.title = state.list.title || 'Block Checklist'; }
    else if (store.get('lastChecklist') === cid) store.set('lastChecklist', '');
    checkAdmin();
    render();
  }, () => { state.loaded = true; state.error = 'We could not load this checklist. Check your internet and try again.'; render(); });
  onSnapshot(collection(db, 'checklists', cid, 'families'), (snap) => {
    state.families = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.families.sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(String(b.name)));
    render();
  }, () => {});
} else {
  state.loaded = true;
}

let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Added to your apps'); render(); });
const canOfferInstall = () => !isStandalone() && (deferredInstall || isIOS());

async function install() {
  if (deferredInstall) {
    deferredInstall.prompt();
    await deferredInstall.userChoice.catch(() => {});
    deferredInstall = null;
    render();
    return;
  }
  openSheet(`<h2>Add to your Home Screen</h2>
    <ol>
      <li>Tap the Share button <span class="ico">${I.share}</span> in Safari.</li>
      <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
      <li>Tap <b>Add</b>. The checklist now opens like an app.</li>
    </ol>
    <button class="btn" data-close="1">Got it</button>`);
}

function openSheet(html) {
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  s.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) s.innerHTML = ''; }));
}

function reqs() { return (state.list && state.list.requirements) || []; }
const has = (f, r) => !!(f.ticks && f.ticks[r.id]);
const isComplete = (f, R) => R.length > 0 && R.every((r) => has(f, r));

function topBar() {
  return `<header class="top">
    <span class="brand"><img src="icon-192.png" alt="">Block Checklist</span>
    ${canOfferInstall() ? `<button class="pill-btn" id="installBtn">${I.down}Add to Home Screen</button>` : ''}
  </header>`;
}

function renderNoList() {
  $app.innerHTML = `
    ${topBar()}
    <section class="card hero">
      <div>
        <h1>${cid ? 'This checklist was not found' : 'Keep track of your block, together'}</h1>
        <p class="sub" style="margin-top:8px">${cid ? 'The link may be incomplete. Ask your organizer to send it again.' : 'One link for the whole block. Families tick what they already have, and everyone sees who still needs it.'}</p>
      </div>
      ${SCENE}
    </section>
    <section class="card" style="display:grid;gap:14px">
      <h2>Start a checklist</h2>
      <p class="sub small">For the organizer. You'll add the requirements and the families, then share the link in your group chat.</p>
      <input id="newTitle" class="field" placeholder="Name it, e.g. Block 5 Requirements" maxlength="60" aria-label="Checklist name">
      <button class="btn" id="createBtn">${state.user ? 'Create checklist' : 'Sign in with Google to start'}</button>
      ${state.user ? `<p class="sub small">Signed in as ${esc(state.user.email)} · <button class="linkbtn" id="outBtn">Sign out</button></p>` : ''}
    </section>
    <p class="sub small" style="text-align:center">Got a link from your organizer? Just open it. No sign-in needed to tick.</p>`;
  document.getElementById('createBtn').onclick = async () => {
    if (!state.user) { await signIn(); return; }
    const title = document.getElementById('newTitle').value.trim() || 'Block Requirements';
    const ref = doc(collection(db, 'checklists'));
    try {
      await setDoc(ref, { title, ownerUid: state.user.uid, requirements: [{ id: rid(), name: 'Meralco on own poste' }, { id: rid(), name: 'Barangay permit' }], createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      store.set('openAdmin', '1');
      location.search = '?c=' + ref.id;
    } catch (e) {
      toast('Could not create the checklist. Please try again.');
    }

  const out = document.getElementById('outBtn');
  if (out) out.onclick = () => signOut(auth);
  const ib = document.getElementById('installBtn');
  if (ib) ib.onclick = install;
}

let pending = false;
function typing() {
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && $app.contains(a);
}
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) render(); }, 0));

function render(force) {
  if (!state.loaded) return;
  if (!force && typing()) { pending = true; return; }
  pending = false;
  if (state.error) { $app.innerHTML = `${topBar()}<div class="card empty"><div class="icon">📶</div><h2>${esc(state.error)}</h2></div>`; return; }
  if (!cid || !state.list) { renderNoList(); return; }
  const R = reqs();
  const F = state.families;
  const q = state.q.trim().toLowerCase();
  const completeCount = F.filter((f) => isComplete(f, R)).length;
  const pct = F.length ? Math.round((completeCount / F.length) * 100) : 0;

  let shown = F.filter((f) => !q || String(f.name).toLowerCase().includes(q) || String(f.lot || '').toLowerCase().includes(q));
  if (state.filter) shown = shown.filter((f) => !has(f, { id: state.filter }));
  if (state.view === 'todo') shown = shown.filter((f) => !isComplete(f, R));
  if (state.view === 'done') shown = shown.filter((f) => isComplete(f, R));
  const filterReq = R.find((r) => r.id === state.filter);

  const stats = R.map((r) => {
    const done = F.filter((f) => has(f, r)).length;
    const p = F.length ? Math.round((done / F.length) * 100) : 0;
    const missing = F.length - done;
    return `<button class="stat" data-filter="${r.id}" aria-pressed="${state.filter === r.id}">
      <div class="t"><span>${esc(r.name)}</span><span class="num">${done}/${F.length}</span></div>
      <div class="bar"><span style="width:${p}%"></span></div>
      <div class="hint ${F.length && !missing ? 'ok' : ''}">${F.length ? (missing ? `${missing} ${missing === 1 ? 'family' : 'families'} still without · see who` : 'Everyone has this 🎉') : 'No families yet'}</div>
    </button>`;
  }).join('');

  const cards = shown.map((f) => {
    const have = R.filter((r) => has(f, r)).length;
    const all = isComplete(f, R);
    return `<article class="card fam ${all ? 'complete' : ''}">
      <div class="fam-head">
        <div class="who">
          <div class="avatar" style="background:${colorFor(f.name)}" aria-hidden="true">${esc(initials(f.name))}</div>
          <div><div class="fam-name">${esc(f.name)}</div>${f.lot ? `<div class="fam-lot">${esc(f.lot)}</div>` : ''}</div>
        </div>
        <div class="fam-count ${all ? 'all' : ''}">${all ? 'Complete ✓' : `${have} of ${R.length}`}</div>
      </div>
      <div class="ticks">${R.map((r) => `<button class="tick" aria-pressed="${has(f, r)}" data-fam="${f.id}" data-req="${r.id}"><span class="box">${I.check}</span>${esc(r.name)}</button>`).join('')}</div>
      ${have ? `<div class="updated">Updated ${ago(f.updatedAt)}</div>` : ''}
    </article>`;
  }).join('');

  const shareUrl = location.origin + location.pathname + '?c=' + cid;
  let emptyMsg = 'No families yet';
  let emptySub = 'The organizer will add the families soon.';
  if (F.length) {
    emptySub = '';
    if (q) emptyMsg = 'No family matches your search';
    else if (filterReq) emptyMsg = 'Everyone already has this 🎉';
    else if (state.view === 'todo') emptyMsg = 'Every family is complete 🎉';
    else emptyMsg = 'No complete families yet';
  }

  $app.innerHTML = `
    ${topBar()}
    <section class="card hero">
      <div>
        <h1>${esc(state.list.title || 'Block Requirements')}</h1>
        <div class="meta"><span class="chip">🏠 ${F.length} ${F.length === 1 ? 'family' : 'families'}</span><span class="chip">📋 ${R.length} ${R.length === 1 ? 'requirement' : 'requirements'}</span></div>
      </div>
      <div class="ring" style="--p:${pct}" role="img" aria-label="${completeCount} of ${F.length} families complete"><div><b>${completeCount}/${F.length}</b><span>complete</span></div></div>
      ${SCENE}
    </section>

    <div class="how"><span class="dot">${I.check}</span><span>Find your family, then <b>tap each requirement you already have</b>. It saves right away for everyone.</span></div>

    ${state.admin && state.adminOpen ? adminHtml(shareUrl) : ''}

    ${R.length ? `<div class="section-h"><h2>Summary</h2><span>Tap one to see who still needs it</span></div><section class="stats" aria-label="Summary">${stats}</section>` : ''}

    <div class="section-h"><h2>Families</h2><span>${shown.length === F.length ? '' : `Showing ${shown.length} of ${F.length}`}</span></div>
    <section class="tools">
      ${F.length > 4 ? `<label class="search">${I.search}<input id="q" class="field" type="search" placeholder="Search family name or lot" value="${esc(state.q)}" aria-label="Search families" autocomplete="off"></label>` : ''}
      ${F.length && R.length ? `<div class="seg" role="group" aria-label="Show">
        <button data-view="all" aria-pressed="${state.view === 'all'}">All (${F.length})</button>
        <button data-view="todo" aria-pressed="${state.view === 'todo'}">Not yet complete (${F.length - completeCount})</button>
        <button data-view="done" aria-pressed="${state.view === 'done'}">Complete (${completeCount})</button>
      </div>` : ''}
      ${filterReq ? `<div class="filterbar"><span class="grow">Without: ${esc(filterReq.name)}</span><button class="btn small ghost" id="clearFilter">Show all</button></div>` : ''}
    </section>

    <section class="list">${cards || `<div class="card empty"><div class="icon">${F.length ? (q ? '🔍' : '🎉') : '🏠'}</div><h2>${emptyMsg}</h2>${emptySub ? `<p class="sub">${emptySub}</p>` : ''}</div>`}</section>

    <footer class="foot">
      <span class="live"><i></i>Live · updates for everyone</span>
      ${state.admin ? `<button class="linkbtn" id="adminToggle">${state.adminOpen ? 'Close organizer tools' : 'Organizer tools'}</button>` : `<button class="linkbtn" id="adminSignIn">${state.user ? 'Sign out' : 'Organizer sign-in'}</button>`}
    </footer>`;

  bind(shareUrl);
}

function summaryText(shareUrl) {
  const R = reqs();
  const F = state.families;
  const date = new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
  const lines = [`📋 ${state.list.title || 'Block Requirements'} — update as of ${date}`, ''];
  R.forEach((r) => {
    const without = F.filter((f) => !has(f, r));
    lines.push(`${without.length ? '⏳' : '✅'} ${r.name}: ${F.length - without.length} of ${F.length} done`);
    if (without.length) lines.push('   Still without: ' + without.map((f) => f.name + (f.lot ? ` (${f.lot})` : '')).join(', '));
  });
  lines.push('', 'Please tick what your family already has here:', shareUrl);
  return lines.join('\n');
}

async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg);
  } catch {
    openSheet(`<h2>Copy this</h2><textarea class="field" readonly style="min-height:200px">${esc(text)}</textarea><button class="btn" data-close="1">Done</button>`);
    const ta = document.querySelector('.sheet textarea');
    ta.focus();
    ta.select();
  }
}

    <div class="admin-h"><h2>Organizer tools</h2><span class="sub small">Only you can see this · ${esc(state.user.email || '')}</span></div>

    <div class="admin-sec" style="border-top:0;padding-top:0">

      <div class="row">

        ${c === 'r:' + r.id
          ? `<button class="btn small danger" data-delreq="${r.id}">Delete</button><button class="btn small ghost" data-cancel="1">Keep</button>`

    <div class="admin-sec">

        ${c === 'f:' + f.id

          : `<button class="iconbtn" data-editfam="${f.id}" aria-label="Edit ${esc(f.name)}">${I.edit}</button><button class="iconbtn del" data-askfam="${f.id}" aria-label="Delete ${esc(f.name)}">${I.trash}</button>`}
      </div>`).join('') || '<p class="sub small">No families yet. Add them below.</p>'}
      <div class="row"><input id="famName" class="field" style="flex:1 1 100%" placeholder="Family name, e.g. Dela Cruz" maxlength="50" aria-label="Family name"><input id="famLot" class="field grow" placeholder="Lot or house no. (optional)" maxlength="20" aria-label="Lot"><button class="btn small" id="addFam">${I.plus}Add</button></div>
      <details id="bulkBox" ${state.bulkOpen ? 'open' : ''}>
        <summary class="linkbtn" style="cursor:pointer;display:inline-block">Add many families at once</summary>
        <div style="display:grid;gap:8px;margin-top:8px">
          <p class="sub small">One family per line. Put the lot after a comma if you like, e.g. <b>Santos, Lot 6</b></p>
          <textarea id="bulk" class="field" placeholder="Dela Cruz, Lot 5&#10;Santos, Lot 6&#10;Reyes, Lot 7" aria-label="Families, one per line"></textarea>
          <button class="btn small" id="addBulk">Add all</button>
        </div>
      </details>
    </div>

    <div class="row" style="justify-content:flex-end"><button class="btn small ghost" id="outBtn">Sign out</button></div>
  </section>`;

function bind(shareUrl) {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));
  const ib = document.getElementById('installBtn');
  if (ib) ib.onclick = install;
  on('.tick', 'click', async (e) => {
    const b = e.currentTarget;
    const fam = state.families.find((f) => f.id === b.dataset.fam);
    const reqId = b.dataset.req;
    const now = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(now));
    const willComplete = now && fam && reqs().every((r) => r.id === reqId || has(fam, r));
    if (willComplete) { const rect = b.getBoundingClientRect(); confetti(rect.left + rect.width / 2, rect.top + rect.height / 2); }
    try {
      await updateDoc(doc(db, 'checklists', cid, 'families', b.dataset.fam), { ['ticks.' + reqId]: now ? true : deleteField(), updatedAt: serverTimestamp() });
      toast(willComplete ? `${fam.name} is complete! 🎉` : now ? 'Saved ✓' : 'Unticked');
    } catch (err) {
      b.setAttribute('aria-pressed', String(!now));
      toast('Not saved. Check your internet and try again.');
    }
  });
  on('.stat', 'click', (e) => {
    const id = e.currentTarget.dataset.filter;
    state.filter = state.filter === id ? null : id;
    if (state.filter) state.view = 'all';
    render();
    if (state.filter) document.querySelector('.tools').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  on('[data-view]', 'click', (e) => { state.view = e.currentTarget.dataset.view; state.filter = null; render(); });
  const cf = document.getElementById('clearFilter');
  if (cf) cf.onclick = () => { state.filter = null; render(); };
  const qi = document.getElementById('q');
  if (qi) qi.addEventListener('input', (e) => {
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render(true);
    const again = document.getElementById('q');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });
  const signBtn = document.getElementById('adminSignIn');
  if (signBtn) signBtn.onclick = async () => {
    if (state.user) { await signOut(auth); toast('Signed out'); return; }
    store.set('openAdmin', '1');
    await signIn();
    setTimeout(() => { if (state.user && !state.admin) { store.set('openAdmin', ''); toast('This account is not the organizer of this checklist.'); } }, 1500);
  };
  const tog = document.getElementById('adminToggle');
  if (tog) tog.onclick = () => { state.adminOpen = !state.adminOpen; state.confirm = null; render(); if (state.adminOpen) document.querySelector('.admin').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if (!(state.admin && state.adminOpen)) return;

  const listRef = doc(db, 'checklists', cid);
  const famRef = (id) => doc(db, 'checklists', cid, 'families', id);
  const safe = (fn) => async (...a) => { try { await fn(...a); } catch { toast('Not saved. Check your internet and try again.'); } };
  const saveReqs = (list) => updateDoc(listRef, { requirements: list, updatedAt: serverTimestamp() });
  const enter = (id, btnId) => { const el = document.getElementById(id); if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); } }); };
  enter('newReq', 'addReq');
  enter('famName', 'addFam');
  enter('famLot', 'addFam');
  enter('titleIn', 'saveTitle');

  document.getElementById('bulkBox').addEventListener('toggle', (e) => { state.bulkOpen = e.target.open; });
  document.getElementById('copyLink').onclick = () => copyText(shareUrl, 'Link copied. Paste it in your group chat.');
  document.getElementById('copySummary').onclick = () => copyText(summaryText(shareUrl), 'Update copied. Paste it in your group chat.');
  const sl = document.getElementById('shareLink');
  if (sl) sl.onclick = () => navigator.share({ title: state.list.title, text: 'Please tick the requirements your family already has:', url: shareUrl }).catch(() => {});
  document.getElementById('saveTitle').onclick = safe(async () => {
    const el = document.getElementById('titleIn');
    const t = el.value.trim();
    if (!t) return;
    el.blur();
    await updateDoc(listRef, { title: t, updatedAt: serverTimestamp() });
    toast('Name saved');
  });
  document.getElementById('addReq').onclick = safe(async () => {
    const el = document.getElementById('newReq');
    const name = el.value.trim();
    if (!name) { el.focus(); return; }
    el.value = '';
    el.blur();
    await saveReqs([...reqs(), { id: rid(), name }]);
    toast('Requirement added');
  });
  on('[data-rename]', 'change', safe(async (e) => {
    const id = e.target.dataset.rename;
    const name = e.target.value.trim();
    if (!name) { render(); return; }
    await saveReqs(reqs().map((r) => (r.id === id ? { ...r, name } : r)));
    toast('Renamed');
  }));
  on('[data-askreq]', 'click', (e) => { state.confirm = 'r:' + e.currentTarget.dataset.askreq; render(); });
  on('[data-askfam]', 'click', (e) => { state.confirm = 'f:' + e.currentTarget.dataset.askfam; render(); });
  on('[data-cancel]', 'click', () => { state.confirm = null; render(); });
  on('[data-delreq]', 'click', safe(async (e) => {
    const id = e.currentTarget.dataset.delreq;
    state.confirm = null;
    if (state.filter === id) state.filter = null;
    await saveReqs(reqs().filter((r) => r.id !== id));
    toast('Requirement deleted');
  }));
  on('[data-delfam]', 'click', safe(async (e) => {
    state.confirm = null;
    await deleteDoc(famRef(e.currentTarget.dataset.delfam));
    toast('Family deleted');
  }));
  on('[data-editfam]', 'click', (e) => {
    const f = state.families.find((x) => x.id === e.currentTarget.dataset.editfam);
    const item = e.currentTarget.closest('.item');
    item.innerHTML = `<input class="field grow" data-en="1" value="${esc(f.name)}" maxlength="50" aria-label="Family name"><input class="field" style="flex:1 1 110px;max-width:160px" data-el="1" value="${esc(f.lot || '')}" placeholder="Lot" maxlength="20" aria-label="Lot"><button class="btn small" data-es="1">Save</button>`;
    const nameIn = item.querySelector('[data-en]');
    nameIn.focus();
    const saveBtn = item.querySelector('[data-es]');
    saveBtn.addEventListener('mousedown', (ev) => ev.preventDefault());
    saveBtn.onclick = safe(async () => {
      const name = nameIn.value.trim();
      if (!name) return;
      const lot = item.querySelector('[data-el]').value.trim();
      if (document.activeElement) document.activeElement.blur();
      await updateDoc(famRef(f.id), { name, lot });
      toast('Saved');
      render();
    });
  });
  document.getElementById('addFam').onclick = safe(async () => {
    const n = document.getElementById('famName');
    const l = document.getElementById('famLot');
    const name = n.value.trim();
    if (!name) { n.focus(); return; }
    const lot = l.value.trim();
    n.value = '';
    l.value = '';
    n.blur();
    l.blur();
    await addDoc(collection(db, 'checklists', cid, 'families'), { name, lot, ticks: {}, order: Date.now(), updatedAt: serverTimestamp() });
    toast(name + ' added');
  });
  document.getElementById('addBulk').onclick = safe(async () => {
    const box = document.getElementById('bulk');
    const lines = box.value.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) { box.focus(); return; }
    box.value = '';
    box.blur();
    const base = Date.now();
    for (let start = 0; start < lines.length; start += 400) {
      const batch = writeBatch(db);
      lines.slice(start, start + 400).forEach((l, i) => {
        const [name, ...rest] = l.split(',');
        batch.set(doc(collection(db, 'checklists', cid, 'families')), { name: name.trim().slice(0, 50), lot: rest.join(',').trim().slice(0, 20), ticks: {}, order: base + start + i, updatedAt: serverTimestamp() });
      });
      await batch.commit();
    }
    toast(lines.length + (lines.length === 1 ? ' family added' : ' families added'));
  });
  document.getElementById('outBtn').onclick = async () => { state.adminOpen = false; await signOut(auth); toast('Signed out'); };
}

setInterval(() => { if (state.families.some((f) => f.updatedAt)) render(); }, 60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
</body>
</html>
