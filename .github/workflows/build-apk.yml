name: Build Sinop APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SINOP_KEYSTORE_BASE64: ${{ secrets.SINOP_KEYSTORE_BASE64 }}
      SINOP_KEYSTORE_PASSWORD: ${{ secrets.SINOP_KEYSTORE_PASSWORD }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        run: echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Install packages
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm.log || { echo "::error title=npm ci failed::$(tail -40 npm.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Generate Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log || { echo "::error title=prebuild failed::$(tail -40 prebuild.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Use the Sinop signing key
        run: node scripts/android-signing.js

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log || { echo "::error title=Gradle build failed::$(grep -E 'error|Error|FAILED|What went wrong' -A3 ../gradle.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Sinop.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Sinop.aab
          ls -la out

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Sinop-AAB-v${{ env.APP_VERSION }}
          path: out/Sinop.aab

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Sinop v${{ env.APP_VERSION }}
          body: |
            Download **Sinop.apk** below and open it on your Android phone to install.
            If asked, allow your browser to "Install unknown apps".
          files: out/Sinop.apk
          overwrite_files: true
          make_latest: true
