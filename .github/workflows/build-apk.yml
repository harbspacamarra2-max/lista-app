name: Build Sinop APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SINOP_KEYSTORE_BASE64: ${{ secrets.SINOP_KEYSTORE_BASE64 }}
      SINOP_KEYSTORE_PASSWORD: ${{ secrets.SINOP_KEYSTORE_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        run: echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Install packages
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm.log || { echo "::error title=npm ci failed::$(tail -40 npm.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Generate Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log || { echo "::error title=prebuild failed::$(tail -40 prebuild.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }

      - name: Use the Sinop signing key
        run: node scripts/android-signing.js
        env:
          SINOP_SIGNING_SHA1: EE:22:5B:63:24:2D:8D:17:3B:4C:2D:93:B6:3D:CE:A7:20:2D:7C:4E

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log

      - name: Report build errors
        if: failure()
        run: |
          esc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          if [ -f gradle.log ]; then
            m1=$(grep -E "What went wrong" -A 18 gradle.log | head -60 | esc)
            m2=$(grep -E "^e: |: error:|error: |Execution failed for task|Could not resolve|Could not find" gradle.log | grep -v "^w: " | head -40 | esc)
            m3=$(grep -E "FAILURE|BUILD FAILED" -B 2 -A 30 gradle.log | head -50 | esc)
            [ -n "$m1" ] && echo "::error title=What went wrong::$m1"
            [ -n "$m2" ] && echo "::error title=Compile errors::$m2"
            [ -n "$m3" ] && echo "::error title=Failure summary::$m3"
          fi
          exit 0

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Sinop.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Sinop.aab
          ls -la out

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Sinop-AAB-v${{ env.APP_VERSION }}
          path: out/Sinop.aab

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Sinop v${{ env.APP_VERSION }}
          body: |
            Download **Sinop.apk** below and open it on your Android phone to install.
            If asked, allow your browser to "Install unknown apps".
          files: out/Sinop.apk
          overwrite_files: true
          make_latest: true
